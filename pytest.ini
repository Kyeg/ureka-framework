[pytest]
addopts = -x
markers = 
    mark_name: description


; ------------------------- <My Policy> Always open: 
; ----                 ----                   capture Exception when Test <FAILED>, for quickly debug (log_level = warning)
; ----                 ----               During debugging:
; ----                 ----                   make the log_level = warning -> (basic) info -> (more trace) debug
; ----                 ----                       (so that comprehending the flow & positioning current state faster)
; ----Captured log call----                   use Debugger (Breakpoint+Watch) 
; ----                 ----                       or (if no Debugger) temporarily put diagnostic variable in INFO
; ----                 ----               After finish debugging: 
; -------------------------                   archiving diagnostic variable into DEBUG/(TRACE)

; log_cli_level = debug
;   ^
;   |
; log_cli_level = info
;   ^
;   |
log_level = warning
log_format = [%(levelname)8s] %(filename)50s->%(funcName)50s(): %(lineno)s: %(message)s


; --------------------- <My Policy> 
; ----Live log call----     Seldom use for Debugging. Because we just focus on the Single Failed Test.
; ----             ----     But it only openned for Tracing <PASSED> Code.
; ---------------------     (Quick Overview of major state changes in the Flows and Important Information INFO)

; log_cli = true
; log_cli_level = debug
;   ^
;   |
; log_cli_level = info
; log_cli_format = [%(levelname)8s] %(filename)50s->%(funcName)50s(): %(lineno)s: %(message)s


; ---------------- <My Policy> Always open: 
; ----Log File----                   record everything, but just as Archive most time
; ----------------
; by default is 'w' mode (no 'a' mode in pytest api...?)
; log_file_level can be lowest so that file store every messages

log_file = ./pytest.log
log_file_level = debug
log_file_format = %(asctime)s [%(levelname)8s] %(filename)50s->%(funcName)50s(): %(lineno)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S